[project]
name = "bp2d"
version = "0.1.0"
description = "2D axisymmetric structural analysis tool for launch vehicle booster pump casings"
readme = "README.md"
authors = [
    { name = "Imchul", email = "33722537+Imchul@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4.3",
    "gmsh>=4.15.2",
    "matplotlib>=3.10.9",
    "numpy>=2.0",
    "plotly>=6.7.0",
    "scipy>=1.13",
    "shapely>=2.1.2",
    "streamlit>=1.56.0",
]

[project.optional-dependencies]
mesh = ["gmsh>=4.13"]
io = ["ezdxf>=1.3"]
viz = ["pyvista>=0.44", "matplotlib>=3.9"]
ui = ["streamlit>=1.36"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
